  <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#c491ee"/><stop offset="1" stop-color="#8251b2"/></linearGradient>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#ac6ee2" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1440" height="420" rx="24" fill="url(#bg)"/>
